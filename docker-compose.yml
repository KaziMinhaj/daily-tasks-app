version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daily_sells_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/daily_sells_db?schema=public
      - JWT_SECRET=daily-sells-tracker-super-secret-jwt-key-2026-bangladesh
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DEFAULT_TIMEZONE=Asia/Dhaka
      - NEXT_PUBLIC_DEFAULT_LOCALE=bn
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: daily_sells_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: daily_sells_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
